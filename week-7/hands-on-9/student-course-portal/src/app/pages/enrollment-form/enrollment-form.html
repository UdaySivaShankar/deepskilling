<div class="form-container">
  <h2>Enrollment Request</h2>

  <div *ngIf="submitted" class="success-message">
    Enrollment request submitted successfully!
  </div>

  <form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)">
    <div class="form-group">
      <label for="studentName">Student Name:</label>
      <input type="text" id="studentName" name="studentName"
             [(ngModel)]="studentName"
             #nameCtrl="ngModel"
             required minlength="3">
      
      <div *ngIf="nameCtrl.touched && nameCtrl.invalid" class="error">
        <span *ngIf="nameCtrl.errors?.['required']">Name is required.</span>
        <span *ngIf="nameCtrl.errors?.['minlength']">Name must be at least 3 characters.</span>
      </div>
    </div>

    <div class="form-group">
      <label for="studentEmail">Email:</label>
      <input type="email" id="studentEmail" name="studentEmail"
             [(ngModel)]="studentEmail"
             #emailCtrl="ngModel"
             required email>
             
      <div *ngIf="emailCtrl.touched && emailCtrl.invalid" class="error">
        <span *ngIf="emailCtrl.errors?.['required']">Email is required.</span>
        <span *ngIf="emailCtrl.errors?.['email']">Must be a valid email.</span>
      </div>
    </div>

    <div class="form-group">
      <label for="courseId">Course ID:</label>
      <input type="number" id="courseId" name="courseId"
             [(ngModel)]="courseId"
             required>
    </div>

    <div class="form-group">
      <label for="preferredSemester">Preferred Semester:</label>
      <select id="preferredSemester" name="preferredSemester"
              [(ngModel)]="preferredSemester">
        <option value="Odd">Odd</option>
        <option value="Even">Even</option>
      </select>
    </div>

    <div class="form-group checkbox-group">
      <input type="checkbox" id="agreeToTerms" name="agreeToTerms"
             [(ngModel)]="agreeToTerms"
             required>
      <label for="agreeToTerms">I agree to the terms and conditions</label>
    </div>

    <div class="actions">
      <button type="submit" [disabled]="enrollForm.invalid">Submit</button>
      <button type="button" (click)="enrollForm.resetForm(); submitted = false">Reset</button>
    </div>
  </form>
</div>
