<div class="course-list-container">
  <h2>Available Courses</h2>
  
  <div *ngIf="isLoading$ | async; else courseList" class="loading-indicator">
    Loading courses...
  </div>
  
  <ng-template #courseList>
    <div class="course-grid">
      <!-- *ngFor loop iterates over courses array and creates a CourseCardComponent for each -->
      <!-- trackBy prevents unnecessary re-rendering -->
      <app-course-card
        *ngFor="let c of courses$ | async; trackBy: trackByCourseId"
        [course]="c"
        (enrollRequested)="onEnroll($event)"
      ></app-course-card>
    </div>
  </ng-template>
</div>
