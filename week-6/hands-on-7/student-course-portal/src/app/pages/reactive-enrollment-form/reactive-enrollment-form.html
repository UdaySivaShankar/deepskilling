<div class="form-container">
  <h2>Reactive Enrollment Request</h2>

  <div *ngIf="submitted" class="success-message">
    Enrollment request submitted successfully!
  </div>

  <form [formGroup]="enrollForm" (ngSubmit)="onSubmit()">
    
    <div class="form-group">
      <label for="studentName">Student Name:</label>
      <input type="text" id="studentName" formControlName="studentName">
      <div *ngIf="enrollForm.get('studentName')?.touched && enrollForm.get('studentName')?.invalid" class="error">
        <span *ngIf="enrollForm.get('studentName')?.errors?.['required']">Name is required.</span>
        <span *ngIf="enrollForm.get('studentName')?.errors?.['minlength']">Name must be at least 3 characters.</span>
      </div>
    </div>

    <div class="form-group">
      <label for="studentEmail">Email:</label>
      <input type="email" id="studentEmail" formControlName="studentEmail">
      <div *ngIf="enrollForm.get('studentEmail')?.touched && enrollForm.get('studentEmail')?.invalid" class="error">
        <span *ngIf="enrollForm.get('studentEmail')?.errors?.['required']">Email is required.</span>
        <span *ngIf="enrollForm.get('studentEmail')?.errors?.['email']">Must be a valid email.</span>
        <span *ngIf="enrollForm.get('studentEmail')?.errors?.['emailTaken']">Email is already taken.</span>
      </div>
      <div *ngIf="enrollForm.get('studentEmail')?.pending" class="pending">Checking email...</div>
    </div>

    <div class="form-group">
      <label for="courseId">Course ID:</label>
      <input type="text" id="courseId" formControlName="courseId">
      <div *ngIf="enrollForm.get('courseId')?.touched && enrollForm.get('courseId')?.invalid" class="error">
        <span *ngIf="enrollForm.get('courseId')?.errors?.['required']">Course ID is required.</span>
        <span *ngIf="enrollForm.get('courseId')?.errors?.['noCourseCode']">Course code starting with XX is not allowed.</span>
      </div>
    </div>

    <div class="form-group">
      <label for="preferredSemester">Preferred Semester:</label>
      <select id="preferredSemester" formControlName="preferredSemester">
        <option value="Odd">Odd</option>
        <option value="Even">Even</option>
      </select>
    </div>

    <!-- Dynamic FormArray -->
    <div class="form-group array-group" formArrayName="additionalCourses">
      <h4>Additional Courses</h4>
      <div *ngFor="let ctrl of additionalCourses.controls; let i=index" class="array-item">
        <input type="text" [formControlName]="i" placeholder="Additional Course ID">
        <button type="button" (click)="removeCourse(i)">Remove</button>
      </div>
      <button type="button" (click)="addCourse()">Add Another Course</button>
    </div>

    <div class="form-group checkbox-group">
      <input type="checkbox" id="agreeToTerms" formControlName="agreeToTerms">
      <label for="agreeToTerms">I agree to the terms and conditions</label>
    </div>

    <div class="actions">
      <button type="submit" [disabled]="enrollForm.invalid">Submit</button>
      <button type="button" (click)="enrollForm.reset()">Reset</button>
    </div>
  </form>
</div>
